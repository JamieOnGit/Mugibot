# Fly.io — see docs/SETUP.md, step 3.
app = "mugibot"   # change to your own app name
primary_region = "syd"   # Sydney

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_PATH = "/data/mugibot.db"
  TRUST_PROXY = "1"

# The database file. Fly snapshots volumes daily.
[[mounts]]
  source = "mugibot_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running: the restock monitor works in the background.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
