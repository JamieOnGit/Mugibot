# Fly.io — see docs/SETUP.md, step 3.
app = "mugibot-live"   # must match the name in `fly apps create` (docs/SETUP.md, step 3b)
primary_region = "syd"   # Sydney

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_PATH = "/data/mugibot.db"
  TRUST_PROXY = "1"

# The database file. Fly snapshots volumes daily.
[[mounts]]
  source = "mugibot_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running: the restock monitor works in the background.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# A quarter of a core guaranteed (shared-cpu-1x is held to 1/16 once its burst credit runs out, and the
# round-the-clock store searches used it up: every search then queued for the CPU).
[[vm]]
  size = "shared-cpu-4x"
  memory = "1gb"
